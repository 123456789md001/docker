<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
    .chat-card { width: 100%; max-width: 480px; height: 90vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
    
    /* Config Header */
    .config-bar { padding: 10px 14px; background: #fafafa; border-bottom: 1px solid #e5e7eb; display: flex; flex-direction: column; gap: 6px; }
    .config-bar input { padding: 7px 10px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; }
    
    /* Messages */
    .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 3px; }
    .ai { align-self: flex-start; background: #e5e7eb; color: #1f2937; border-bottom-left-radius: 3px; }
    
    /* Input Area */
    .input-bar { display: flex; padding: 12px; border-top: 1px solid #e5e7eb; gap: 8px; background: #fff; }
    .input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
    .input-bar button { padding: 10px 18px; border: none; background: #2563eb; color: #fff; border-radius: 8px; font-weight: 500; cursor: pointer; }
    .input-bar button:disabled { background: #93c5fd; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-card">
  <!-- API Settings -->
  <div class="config-bar">
    <input type="text" id="endpoint" value="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" placeholder="API Endpoint URL" />
    <input type="password" id="apiKey" placeholder="Paste API Key (AIzaSy...)" />
    <input type="text" id="model" value="gemini-2.5-flash" placeholder="Model (e.g. gemini-2.5-flash)" />
  </div>

  <!-- Chat Log -->
  <div class="messages-container" id="chat"></div>

  <!-- Message Form -->
  <form class="input-bar" id="chatForm">
    <input type="text" id="prompt" placeholder="Type a message..." required autocomplete="off" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("chatForm");
  const prompt = document.getElementById("prompt");
  const sendBtn = document.getElementById("sendBtn");

  const history = [
    { role: "system", content: "You are a concise, helpful assistant." }
  ];

  function addMessage(role, text) {
    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = prompt.value.trim();
    const key = document.getElementById("apiKey").value.trim();
    const endpoint = document.getElementById("endpoint").value.trim();
    const model = document.getElementById("model").value.trim();

    if (!query) return;
    if (!key) {
      alert("Please enter your API key at the top.");
      return;
    }

    addMessage("user", query);
    history.push({ role: "user", content: query });
    prompt.value = "";
    sendBtn.disabled = true;

    const botBubble = addMessage("ai", "Thinking...");

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${key}`
        },
        body: JSON.stringify({
          model: model,
          messages: history
        })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData?.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || "No reply.";
      botBubble.textContent = reply;
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      botBubble.textContent = `Error: ${err.message}`;
    } finally {
      sendBtn.disabled = false;
      prompt.focus();
    }
  });
</script>

</body>
</html>
